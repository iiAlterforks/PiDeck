<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; connect-src 'self' ws: http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #ffffff; }
      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(1200px 600px at 50% 28%, rgba(13, 13, 13, 0.05), transparent 62%),
          linear-gradient(180deg, #ffffff 0%, #f7f7f8 55%, #f2f2f2 100%);
      }
      #boot-overlay.fade-out { opacity: 0; pointer-events: none; }
      .boot-brand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .boot-logo {
        width: 88px;
        height: 88px;
        display: block;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 14px 32px rgba(13, 13, 13, 0.18);
      }
      .boot-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
      .boot-title {
        color: #1f2937;
        font: 650 20px/1.2 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.01em;
      }
      .boot-subtitle {
        color: #6b7280;
        font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.02em;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0d0d0d; }
        #boot-overlay {
          background:
            radial-gradient(1000px 520px at 50% 30%, rgba(255, 255, 255, 0.06), transparent 60%),
            linear-gradient(180deg, #171717 0%, #0d0d0d 100%);
        }
        .boot-title { color: #f3f4f6; }
        .boot-subtitle { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-overlay">
      <div class="boot-brand">
        <div class="boot-logo"><img src="./src/assets/app-icon.png" alt="" aria-hidden="true" /></div>
        <strong class="boot-title">PiDeck</strong>
        <span class="boot-subtitle">正在启动工作台…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
